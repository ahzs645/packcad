name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: packcad

      - name: Check out Atelier engine
        uses: actions/checkout@v4
        with:
          repository: ahzs645/atelier
          path: atelier

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packcad/pnpm-lock.yaml

      - name: Install engine dependencies
        run: pnpm install --frozen-lockfile
        working-directory: atelier

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packcad

      - name: Typecheck
        run: pnpm typecheck
        working-directory: packcad

      - name: Test
        run: pnpm test
        working-directory: packcad

      - name: Lint
        run: pnpm lint
        working-directory: packcad
